name: Get Citation Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Set Up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: google_scholar_crawler/requirements.txt
    - name: Run
      id: crawl
      run: |
        cd ./google_scholar_crawler
        pip3 install -r requirements.txt
        # hard wall-clock cap: a blocked Scholar session must fail the run
        # (keeping the previous data) instead of hanging for hours
        timeout --kill-after=30 900 python3 -u main.py
        cd ./results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add gs_data.json gs_data_shieldsio.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
    # main.py falls back to the last published data when Scholar can't be
    # fetched; fail loudly once that has lasted a few days
    - name: Check Scholar sync
      if: steps.crawl.outputs.scholar_stale_since
      run: |
        echo "::error::Google Scholar data has not refreshed since ${{ steps.crawl.outputs.scholar_stale_since }}. See the Scholar fetch error in the 'Run' step log."
        exit 1
